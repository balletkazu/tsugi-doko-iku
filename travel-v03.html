<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f5ec"><title>つぎ どこ行く？</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8f5ec;color:#23483f;font-family:system-ui,sans-serif}button,input,textarea,select{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer;border:0;background:none;color:inherit;min-height:48px}button:focus-visible,a:focus-visible{outline:3px solid #b78b45}a{color:inherit}main{max-width:760px;margin:auto;padding-bottom:100px}header{display:flex;align-items:center;justify-content:space-between;padding:14px 22px}header b{font-size:21px;letter-spacing:.04em}h1,h2,h3{font-family:serif;font-weight:500;line-height:1.45}h1{font-size:34px}h2{font-size:28px}p{line-height:1.85}small{color:#526c63} .hero{position:relative;min-height:65svh;display:flex;flex-direction:column;justify-content:end;padding:28px;color:white;background:#31574f;overflow:hidden}.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.hero:after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 25%,#172f2bd9)}.hero>*:not(img){position:relative;z-index:1}.hero h1{margin:10px 0}.hero button{align-self:start;border:1px solid white;padding:8px 20px;border-radius:30px}.section{padding:32px 24px}.primary{background:#28584c;color:white;padding:12px 22px;border-radius:4px}.line{border-bottom:1px solid #b9c5b9;display:flex;width:100%;align-items:center;justify-content:space-between;text-align:left;padding:14px 0}.feature{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center;margin:28px 0}.feature img{width:100%;aspect-ratio:4/5;object-fit:cover}.feature button{text-align:left;padding:0}.feature h3{font-size:23px}.feature:nth-child(odd) img{order:2}nav{position:fixed;bottom:0;left:0;right:0;background:#faf8f1;border-top:1px solid #d4d9ce;display:flex;justify-content:center;z-index:5;padding-bottom:env(safe-area-inset-bottom)}nav button{flex:1;max-width:150px;font-size:12px;padding:8px 0}nav span{display:block;font-size:23px;line-height:1.1}nav button[aria-current=page]{color:#205c48;font-weight:bold;background:#e4e9df}input,textarea,select{width:100%;padding:12px;border:1px solid #9baea2;background:#fffdf8;color:#23483f;border-radius:4px;margin:8px 0 18px}label{display:block}article{padding:20px 0;border-bottom:1px solid #c8d1c5}.cover{background:#eee4cc;padding:24px;border:1px solid #c7b99a}.cover img{width:100%}.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#23483f;color:white;padding:12px 20px;z-index:8;border-radius:6px}.photo{width:100%;aspect-ratio:4/3;object-fit:cover;background:#aabeb4}dialog{border:0;background:#f8f5ec;color:#23483f;max-width:90%;padding:25px}dialog::backdrop{background:#142c29aa} @media print{nav,header,button,.noprint{display:none}main{padding:0}body{background:white}}@media(prefers-reduced-motion:no-preference){#view{animation:appear .3s ease}@keyframes appear{from{opacity:.5}to{opacity:1}}}body{background:#fcfbf7;color:#263d36}h1,h2,h3{font-family:system-ui,sans-serif}h2{font-size:25px}.hero{min-height:48svh;background:#dce5df;color:#263d36;padding:18px}.hero:after{background:none}.hero button{background:#fcfbf7;color:#263d36;border:0;border-radius:3px}.hero img:not(.loaded),.photo:not(.loaded){visibility:hidden}.hero .credit{position:absolute;right:12px;top:12px;background:#fcfbf7;padding:5px;font-size:11px}.quick{padding:12px 20px;display:grid;grid-template-columns:1fr 1fr;gap:14px}.quick button{display:flex;align-items:center;justify-content:space-between;text-align:left;border-bottom:1px solid #9baea2;font-weight:600}.wide{width:100%;margin:20px 0}.checks{display:grid;grid-template-columns:1fr 1fr;margin:12px 0}.checks label{display:flex;gap:8px;align-items:center}.checks input{width:20px;height:20px;margin:8px}.section details{padding:14px 0;border-bottom:1px solid #c8d1c5}.section summary{cursor:pointer;padding:10px 0}.section details[open] summary{margin-bottom:18px}nav button[aria-current=page]{background:transparent;border-top:3px solid #31594c}button:disabled{opacity:.35}.photo{background:#dce5df}#view{animation:none}.credit{font-size:11px} @media print{.quick,details{display:none}}</style></head><body><main><section id="view"></section></main><nav><button onclick="home()" id="nh"><span>⌂</span>発見</button><button onclick="transit()" id="nt"><span>⇄</span>乗換</button><button onclick="mapView()" id="nm"><span>◎</span>地図</button><button onclick="plan()" id="np"><span>▤</span>旅の栞</button><button onclick="journal()" id="nj"><span>✎</span>私の旅</button></nav><dialog id="info"></dialog><script>const $=id=>document.getElementById(id),v=$('view');const places=[['赤西渓谷','兵庫県','自然','森と渓流に出会う'],['元滝伏流水','秋田県','自然','苔と水が織りなす風景'],['犬島','岡山県','文化','島の歴史とアート'],['小値賀島','長崎県','海','島の暮らしと海'],['竜串海岸','高知県','海','波が刻んだ岩の風景'],['平泉寺白山神社','福井県','文化','苔むす歴史の道']];let i=-1;function load(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}function store(k,x){try{localStorage.setItem(k,JSON.stringify(x));return true}catch{alert('保存できませんでした');return false}}function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const logo='';
// Wikimedia Commons image lookup; only known place labels, image attribution from API.
const queries=['赤西渓谷','元滝伏流水','犬島','小値賀島','竜串海岸','平泉寺白山神社'];let pics={};
async function photo(n,el){if(pics[n]){apply(pics[n],el);return}try{let u='https://commons.wikimedia.org/w/api.php?origin=*&action=query&generator=search&gsrnamespace=6&gsrlimit=8&gsrsearch='+encodeURIComponent(queries[n]+' filetype:bitmap')+'&prop=imageinfo&iiprop=url%7Cextmetadata&iiurlwidth=1000&format=json';let d=await(await fetch(u)).json();let p=Object.values(d.query?.pages||{}).find(p=>p.imageinfo?.[0]?.thumburl);if(!p)return;let q=p.imageinfo[0];pics[n]={url:q.thumburl,link:q.descriptionurl,title:p.title};apply(pics[n],el)}catch{}}
function apply(p,el){if(!el.isConnected)return;el.src=p.url;el.classList.add('loaded');el.dataset.credit=p.link;let a=el.parentElement.querySelector('.credit');if(a){a.href=p.link;a.hidden=false}}
function img(n,cls='photo'){return `<img class="${cls}" data-n="${n}" alt="${places[n][0]}の参考画像" ><a class="credit" hidden target="_blank" rel="noopener">写真・ライセンス</a>`}function hydrate(){v.querySelectorAll('img[data-n]').forEach(e=>photo(+e.dataset.n,e))}function active(k){document.querySelectorAll('nav button').forEach(b=>b.removeAttribute('aria-current'));$(k).setAttribute('aria-current','page');window.scrollTo(0,0)}function toast(t){let e=document.createElement('div');e.className='toast';e.setAttribute('role','status');e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2000)}
function home(){active('nh');v.innerHTML=`<div class="quick"><button onclick="openDiscovery(prefs().interest)">旅先を見つける <span>→</span></button><button onclick="transit()">行き方を調べる <span>→</span></button></div><section class="hero">${img(3,'heroimg')}<button onclick="where()">ここは、どこ？ →</button></section><div class="section"><button class="line" onclick="saved()">いつか行きたい場所 <span>♡</span></button><div class="feature"><div>${img(1)}</div><button onclick="openDiscovery('自然')"><h3>水のある風景</h3>見る →</button></div><div class="feature"><div>${img(3)}</div><button onclick="openDiscovery('海')"><h3>島をめぐる</h3>見る →</button></div><div class="feature"><div>${img(5)}</div><button onclick="openDiscovery('文化')"><h3>歴史と文化</h3>見る →</button></div><small>試作版 0.3 · 写真は Wikimedia Commons の参考画像</small></div>`;hydrate()}
function where(){let d=$('info');d.innerHTML='<h2>小値賀島</h2><p>長崎県。島の暮らしと海に出会う旅。写真の正確な撮影地は出典ページをご確認ください。</p>'+(pics[3]?`<a href="${pics[3].link}" target="_blank" rel="noopener">写真の出典</a><br>`:'')+'<button onclick="savePlace(3)">♡ 行きたい</button><button onclick="document.getElementById(&quot;info&quot;).close()">閉じる</button>';d.showModal()}
let group='おまかせ',page=0;function openDiscovery(k){group=k;page=0;mag()}function mag(){active('nh');let a=places.map((p,n)=>n).filter(n=>group==='おまかせ'||places[n][2]===group);let n=a[page],p=places[n];v.innerHTML=`<div class="section"><button onclick="home()">← 発見へ</button><label>旅のテーマ<select onchange="openDiscovery(this.value)">${['おまかせ','自然','海','文化'].map(k=>`<option ${k===group?'selected':''}>${k}</option>`).join('')}</select></label><small>旅の読みもの　${page+1} / ${a.length}</small><div style="margin-top:15px">${img(n)}</div><h2>${p[0]}</h2><small>${p[1]}</small><p>${p[3]}</p><button class="primary" onclick="savePlace(${n})">♡ 行きたい場所に保存</button><p><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p[0]+' '+p[1])}">地図を見る ↗</a></p><div style="display:flex;justify-content:space-between;border-top:1px solid #b9c5b9"><button ${page===0?'disabled':''} onclick="page--;mag()">← 前のページ</button><button onclick="${page===a.length-1?'home()':'page++;mag()'}">${page===a.length-1?'読み終える':'次のページ →'}</button></div><small>6地点の試作データ。交通・安全・営業状況は未確認です。</small></div>`;hydrate()}
function savePlace(n){let a=load('saved',[]);if(!a.includes(n))a.push(n);if(store('saved',a))toast('行きたい場所に保存しました')}
function saved(){active('nj');let a=load('saved',[]).filter(n=>places[n]);v.innerHTML='<div class="section"><h2>いつか行きたい場所</h2>'+(!a.length?'<p>気になる場所を見つけたら、ここに残そう。</p><button class="primary" onclick="openDiscovery(&quot;おまかせ&quot;)">旅先を見つける</button>':'')+a.map(n=>`<article>${img(n)}<h3>${places[n][0]}</h3><small>${places[n][1]}</small><button class="line" onclick="store('saved',load('saved',[]).filter(x=>x!==${n}));saved()">保存を取り消す</button></article>`).join('')+'</div>';hydrate()}
function plan(){active('np');let p=load('plan',{});v.innerHTML=`<div class="section"><h2>旅の栞</h2><div class="cover" id="paper"><small>MY JOURNEY</small><h2 id="preview">${esc(p.title||'小さな旅')}</h2><p id="deco">${esc(p.deco||'')}</p></div><label>旅の名前<input id="title" value="${esc(p.title||'')}" oninput="$('preview').textContent=this.value||'小さな旅'"></label><label>紙の色<select id="color" onchange="$('paper').style.background=this.value"><option value="#eee4cc">生成り</option><option value="#dce8d9">若葉</option><option value="#dbe8ef">空色</option><option value="#f1dfdb">桜色</option></select></label><label>飾り <button onclick="decorate('✿')">✿ 花</button><button onclick="decorate('☆')">☆ 星</button><button onclick="decorate('♡')">♡ 心</button><button onclick="$('deco').textContent=''">消す</button></label><label>日付<input id="date" type="date" value="${esc(p.date||'')}"></label><label>旅程・寄り道<textarea id="it" rows="6">${esc(p.it||'')}</textarea></label><label>予算・持ち物<textarea id="notes" rows="4">${esc(p.notes||'')}</textarea></label><button class="primary" onclick="savePlan()">保存する</button> <button onclick="savePlan();print()">印刷・PDF</button></div>`;$('color').value=p.color||'#eee4cc';$('paper').style.background=$('color').value}function decorate(s){$('deco').textContent+=s+' '}function savePlan(){if(store('plan',{...Object.fromEntries(['title','date','it','notes','color'].map(k=>[k,$(k).value])),deco:$('deco').textContent}))toast('栞を保存しました')}
function journal(){active('nj');v.innerHTML=`<div class="section"><h2>私の旅</h2><button class="line" onclick="saved()">♡ 行きたい場所 →</button><button class="line" onclick="settings()">旅の好み・移動条件 →</button><p>どんな一日も、あなたの旅。</p><label>今日の記録<textarea id="j" rows="12">${esc(load('journal',''))}</textarea></label><button class="primary" onclick="if(store('journal',$('j').value))toast('日記を保存しました')">保存する</button><p><small>記録はこのブラウザ内だけに保存されます。データ削除で失われることがあります。</small></p></div>`}
function prefs(){return load('prefs03',{walk:'60',total:'120',modes:['電車','バス','徒歩','船'],budget:'',interest:'おまかせ',speed:'4'})}
function fields(p){return `<label>一度に歩ける時間<select id="walk">${[10,30,60,120,180,360].map(n=>`<option value="${n}" ${String(n)===p.walk?'selected':''}>${n}分</option>`).join('')}</select></label><label>徒歩の合計時間（分）<input id="total" type="number" min="0" value="${esc(p.total)}"></label><label>歩く速さ<select id="speed">${[2,3,4,5].map(n=>`<option ${String(n)===p.speed?'selected':''} value="${n}">時速${n}km</option>`).join('')}</select></label><div>交通手段</div><div class="checks">${['電車','バス','徒歩','船','自転車','タクシー'].map(m=>`<label><input type="checkbox" name="mode" value="${m}" ${p.modes.includes(m)?'checked':''}>${m}</label>`).join('')}</div><label>交通費の予算（円・片道、任意）<input id="budget" type="number" min="0" value="${esc(p.budget)}" placeholder="指定なし"></label>`}
function getPrefs(){return {...prefs(),walk:$('walk').value,total:$('total').value,speed:$('speed').value,budget:$('budget').value,modes:[...document.querySelectorAll('input[name=mode]:checked')].map(e=>e.value)}}
function settings(){active('nj');let p=prefs();v.innerHTML=`<div class="section"><button onclick="journal()">← 私の旅</button><h2>旅の設定</h2>${fields(p)}<label>好きな旅<select id="interest">${['おまかせ','自然','海','文化'].map(x=>`<option ${x===p.interest?'selected':''}>${x}</option>`).join('')}</select></label><button class="primary" onclick="if(store('prefs03',{...getPrefs(),interest:$('interest').value}))toast('設定を保存しました')">保存する</button></div>`}
function transit(){active('nt');let p=prefs(),r=load('route03',{});v.innerHTML=`<div class="section"><h2>行き方を調べる</h2><form onsubmit="routeSearch(event)"><label>出発地<input id="from" required value="${esc(r.from||'')}" placeholder="駅・場所"></label><label>目的地<input id="to" required value="${esc(r.to||'')}" placeholder="駅・場所"></label><button type="button" class="line" onclick="let a=$('from').value;$('from').value=$('to').value;$('to').value=a">⇅ 出発地と目的地を交換</button><label>優先すること<select id="priority"><option>時間と費用のバランス</option><option>早く着く</option><option>安く行く</option><option>景色を楽しむ</option><option>寄り道する</option></select></label><details><summary>徒歩・交通手段・予算の条件</summary>${fields(p)}<button type="button" onclick="if(store('prefs03',getPrefs()))toast('移動条件を保存しました')">この条件を普段の設定にする</button></details><button class="primary wide" type="submit">検索条件を確認</button></form><div id="result"></div><small>試作段階：独自の時刻表・運賃検索は未実装です。</small></div>`}
function routeSearch(e){e.preventDefault();let p=getPrefs(),from=$('from').value.trim(),to=$('to').value.trim();if(!from||!to||!p.modes.length){toast('場所と交通手段を指定してください');return}store('route03',{from,to});let q=`${from}から${to}へ。${p.modes.join('・')}を組み合わせ、連続徒歩${p.walk}分以内（時速${p.speed}km）、合計徒歩${p.total||'指定なし'}分以内、予算${p.budget||'指定なし'}円、${$('priority').value}を優先。時刻表と運賃を確認して比較してください。`;let result=$('result');result.innerHTML=`<article><h3>検索条件</h3><p>${esc(q)}</p><button id="copyRoute" class="primary">相談用の条件をコピー</button><p><a target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(from)}&destination=${encodeURIComponent(to)}&travelmode=transit">Google マップで公共交通を確認 ↗</a></p><small>外部地図には徒歩・予算などの独自条件は反映されません。</small></article>`;$('copyRoute').onclick=async()=>{try{await navigator.clipboard.writeText(q);toast('コピーしました')}catch{toast('コピーできません。文章を選択してください')}}}
function mapView(){active('nm');v.innerHTML=`<div class="section"><h2>地図</h2><form onsubmit="event.preventDefault();window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent($('mq').value),'_blank','noopener')"><label>場所を探す<input id="mq" required placeholder="駅・観光地など"></label><button class="primary">地図で見る ↗</button></form><p><small>現在は外部地図を利用します。</small></p><button class="line" onclick="saved()">行きたい場所 →</button></div>`}
home();</script></body></html>
