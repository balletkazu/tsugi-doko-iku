<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#29483d"><title>次どこ行く？</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f2e9;color:#29483d;font-family:system-ui,sans-serif}main{max-width:650px;margin:auto;padding:24px 20px 100px}h1{font-size:30px;letter-spacing:.06em}h2{font-size:23px}p{line-height:1.8}.hero{border-radius:20px;overflow:hidden;background:#dce5d8}.hero svg{width:100%;display:block}.hero div,article{padding:20px}button,input,textarea,select{font:inherit}button{border:0;border-radius:12px;padding:13px 17px;background:#29483d;color:white;cursor:pointer}button.secondary{background:#e2e7db;color:#29483d}article{background:#fffdf7;border-radius:16px;margin:16px 0}nav{position:fixed;bottom:0;left:0;right:0;background:#fffdf7;display:flex;justify-content:center;border-top:1px solid #ddd}nav button{background:none;color:#29483d;flex:1;max-width:150px;font-size:14px}input,textarea,select{width:100%;padding:12px;border:1px solid #b9c6b8;border-radius:10px;background:white;color:#29483d;margin:6px 0 12px}small{color:#687c70}a{color:#29483d}label{display:block;margin-top:12px} .wide{width:100%} @media print{nav,button,.noprint{display:none}main{padding:0}}</style><main><small>DISCOVER YOUR WORLD · 試作版 0.1</small><h1>次どこ行く？</h1><section id="view"></section></main><nav><button onclick="home()">発見</button><button onclick="saved()">行きたい</button><button onclick="plan()">旅の栞</button><button onclick="journal()">私の旅</button></nav><script>const $=id=>document.getElementById(id),v=$('view');const places=[['赤西渓谷','兵庫県','自然','森と渓流に出会う'],['元滝伏流水','秋田県','自然','苔と水が織りなす風景'],['犬島','岡山県','文化','島の歴史とアート'],['小値賀島','長崎県','海','島の暮らしと海'],['竜串海岸','高知県','海','波が刻んだ岩の風景'],['平泉寺白山神社','福井県','文化','苔むす歴史の道']];let i=-1;function load(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}function store(k,x){try{localStorage.setItem(k,JSON.stringify(x));return true}catch{alert('保存できませんでした');return false}}function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function home(){v.innerHTML=`<section class="hero"><svg viewBox="0 0 600 310" xmlns="http://www.w3.org/2000/svg"><rect width="600" height="310" fill="#c9dedb"/><circle cx="460" cy="70" r="33" fill="#f9e6ae"/><path d="M0 205L130 70 235 175 355 45 600 210V310H0" fill="#789a94"/><path d="M0 220L125 135 260 240 400 125 600 220V310H0" fill="#456f60"/><path d="M0 285Q200 180 600 255V310H0" fill="#abc3a3"/><path d="M180 310Q375 260 310 235T400 195" fill="none" stroke="#f6e7c7" stroke-width="15"/></svg><div><h2>まだ知らない世界へ。</h2><p>今日は、どんな世界に出会おう。</p><button class="wide" onclick="discover()">次の旅を見つける</button></div></section><label>出会いたい世界</label><select id="kind"><option>おまかせ</option><option>自然</option><option>海</option><option>文化</option></select><div id="result"></div><small>収録した6地点から発見する試作です。交通・料金・安全情報は未確認です。</small>`}function discover(){let k=$('kind').value,a=places.map((p,n)=>n).filter(n=>k==='おまかせ'||places[n][2]===k);i=a[(a.indexOf(i)+1)%a.length];let p=places[i];$('result').innerHTML=`<article><small>${p[1]} · ${p[2]}</small><h2>${p[0]}</h2><p>${p[3]}</p><button onclick="savePlace(${i})">♡ 行きたい場所に保存</button> <a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p[0]+' '+p[1])}">地図を見る</a></article>`}function savePlace(n){let a=load('saved',[]);if(!a.includes(n))a.push(n);if(store('saved',a))alert('保存しました')}function saved(){v.innerHTML='<h2>いつか行きたい場所</h2>'+load('saved',[]).filter(n=>places[n]).map(n=>`<article><h2>${places[n][0]}</h2><p>${places[n][1]}</p><button onclick="store('saved',load('saved',[]).filter(x=>x!==${n}));saved()">削除</button></article>`).join('')}function plan(){let p=load('plan',{});v.innerHTML=`<h2>旅の栞</h2><label>旅の名前<input id="title" value="${esc(p.title||'')}"></label><label>日付<input id="date" type="date" value="${esc(p.date||'')}"></label><label>旅程・寄り道<textarea id="it" rows="7">${esc(p.it||'')}</textarea></label><label>予算・持ち物<textarea id="notes" rows="4">${esc(p.notes||'')}</textarea></label><button onclick="if(store('plan',Object.fromEntries(['title','date','it','notes'].map(k=>[k,$(k).value]))))alert('保存しました')">保存</button> <button onclick="print()" class="secondary">印刷・PDF</button>`}function journal(){v.innerHTML=`<h2>私の旅</h2><p>どんな一日も、あなたの旅。</p><label>今日の記録<textarea id="j" rows="10">${esc(load('journal',''))}</textarea></label><button onclick="if(store('journal',$('j').value))alert('保存しました')">保存</button><p><small>記録はこのブラウザ内のみ。公開・同期されません。ブラウザのデータ削除で消えることがあります。</small></p>`}home();</script></html>
