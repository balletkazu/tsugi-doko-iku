// Wikimedia Commons image lookup; only known place labels, image attribution from API.
const queries=['赤西渓谷','元滝伏流水','犬島','小値賀島','竜串海岸','平泉寺白山神社'];let pics={};
async function photo(n,el){if(pics[n]){apply(pics[n],el);return}try{let u='https://commons.wikimedia.org/w/api.php?origin=*&action=query&generator=search&gsrnamespace=6&gsrlimit=8&gsrsearch='+encodeURIComponent(queries[n]+' filetype:bitmap')+'&prop=imageinfo&iiprop=url%7Cextmetadata&iiurlwidth=1000&format=json';let d=await(await fetch(u)).json();let p=Object.values(d.query?.pages||{}).find(p=>p.imageinfo?.[0]?.thumburl);if(!p)return;let q=p.imageinfo[0];pics[n]={url:q.thumburl,link:q.descriptionurl,title:p.title};apply(pics[n],el)}catch{}}
function apply(p,el){if(!el.isConnected)return;el.src=p.url;el.dataset.credit=p.link;let a=el.parentElement.querySelector('.credit');if(a){a.href=p.link;a.hidden=false}}
function img(n,cls='photo'){return `<img class="${cls}" data-n="${n}" alt="${places[n][0]}の参考画像" src="${logo}"><a class="credit" hidden target="_blank" rel="noopener">写真・ライセンス</a>`}function hydrate(){v.querySelectorAll('img[data-n]').forEach(e=>photo(+e.dataset.n,e))}function active(k){document.querySelectorAll('nav button').forEach(b=>b.removeAttribute('aria-current'));$(k).setAttribute('aria-current','page');window.scrollTo(0,0)}function toast(t){let e=document.createElement('div');e.className='toast';e.setAttribute('role','status');e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2000)}
function home(){active('nh');v.innerHTML=`<div style="padding:0 18px"><img src="${logo}" alt="つぎ どこ行く？ オリジナルロゴ案" style="width:100%;display:block"></div><section class="hero">${img(3,'heroimg')}<small style="color:white">旅の風景 · 小値賀島</small><h1>知らない世界へ。</h1><button onclick="where()">ここは、どこ？ →</button></section><div class="section"><small>発見 / DISCOVER</small><h2>今日は、どこへ。</h2><button class="primary" onclick="openDiscovery('おまかせ')">旅先を見つける　→</button><button class="line" onclick="saved()">いつか行きたい場所 <span>→</span></button><button class="line" onclick="plan()">旅の計画を立てる <span>→</span></button><div class="feature"><div>${img(1)}</div><button onclick="openDiscovery('自然')"><small>01 / 自然</small><h3>水のある風景。</h3>めくる →</button></div><div class="feature"><div>${img(3)}</div><button onclick="openDiscovery('海')"><small>02 / 海</small><h3>島へ、気ままに。</h3>めくる →</button></div><div class="feature"><div>${img(5)}</div><button onclick="openDiscovery('文化')"><small>03 / 文化</small><h3>時をたどる旅。</h3>めくる →</button></div><small>試作版 0.2.1 · 写真は Wikimedia Commons から取得する参考画像。取得できない場合はロゴを表示します。</small></div>`;hydrate()}
function where(){let d=$('info');d.innerHTML='<h2>小値賀島</h2><p>長崎県。島の暮らしと海に出会う旅。写真の正確な撮影地は出典ページをご確認ください。</p>'+(pics[3]?`<a href="${pics[3].link}" target="_blank" rel="noopener">写真の出典</a><br>`:'')+'<button onclick="savePlace(3)">♡ 行きたい</button><button onclick="document.getElementById(&quot;info&quot;).close()">閉じる</button>';d.showModal()}
let group='おまかせ',page=0;function openDiscovery(k){group=k;page=0;mag()}function mag(){active('nh');let a=places.map((p,n)=>n).filter(n=>group==='おまかせ'||places[n][2]===group);let n=a[page],p=places[n];v.innerHTML=`<div class="section"><button onclick="home()">← 発見へ</button><label>旅のテーマ<select onchange="openDiscovery(this.value)">${['おまかせ','自然','海','文化'].map(k=>`<option ${k===group?'selected':''}>${k}</option>`).join('')}</select></label><small>旅の読みもの　${page+1} / ${a.length}</small><div style="margin-top:15px">${img(n)}</div><h2>${p[0]}</h2><small>${p[1]}</small><p>${p[3]}</p><button class="primary" onclick="savePlace(${n})">♡ 行きたい場所に保存</button><p><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p[0]+' '+p[1])}">地図を見る ↗</a></p><div style="display:flex;justify-content:space-between;border-top:1px solid #b9c5b9"><button ${page===0?'disabled':''} onclick="page--;mag()">← 前のページ</button><button onclick="${page===a.length-1?'home()':'page++;mag()'}">${page===a.length-1?'読み終える':'次のページ →'}</button></div><small>6地点の試作データ。交通・安全・営業状況は未確認です。</small></div>`;hydrate()}
function savePlace(n){let a=load('saved',[]);if(!a.includes(n))a.push(n);if(store('saved',a))toast('行きたい場所に保存しました')}
function saved(){active('ns');let a=load('saved',[]).filter(n=>places[n]);v.innerHTML='<div class="section"><h2>いつか行きたい場所</h2>'+(!a.length?'<p>気になる場所を見つけたら、ここに残そう。</p><button class="primary" onclick="openDiscovery(&quot;おまかせ&quot;)">旅先を見つける</button>':'')+a.map(n=>`<article>${img(n)}<h3>${places[n][0]}</h3><small>${places[n][1]}</small><button class="line" onclick="store('saved',load('saved',[]).filter(x=>x!==${n}));saved()">保存を取り消す</button></article>`).join('')+'</div>';hydrate()}
function plan(){active('np');let p=load('plan',{});v.innerHTML=`<div class="section"><h2>旅の栞</h2><div class="cover" id="paper"><small>MY JOURNEY</small><h2 id="preview">${esc(p.title||'小さな旅')}</h2><img src="${logo}" alt="旅のイラスト"><p id="deco">${esc(p.deco||'')}</p></div><label>旅の名前<input id="title" value="${esc(p.title||'')}" oninput="$('preview').textContent=this.value||'小さな旅'"></label><label>紙の色<select id="color" onchange="$('paper').style.background=this.value"><option value="#eee4cc">生成り</option><option value="#dce8d9">若葉</option><option value="#dbe8ef">空色</option><option value="#f1dfdb">桜色</option></select></label><label>飾り <button onclick="decorate('✿')">✿ 花</button><button onclick="decorate('☆')">☆ 星</button><button onclick="decorate('♡')">♡ 心</button><button onclick="$('deco').textContent=''">消す</button></label><label>日付<input id="date" type="date" value="${esc(p.date||'')}"></label><label>旅程・寄り道<textarea id="it" rows="6">${esc(p.it||'')}</textarea></label><label>予算・持ち物<textarea id="notes" rows="4">${esc(p.notes||'')}</textarea></label><button class="primary" onclick="savePlan()">保存する</button> <button onclick="savePlan();print()">印刷・PDF</button></div>`;$('color').value=p.color||'#eee4cc';$('paper').style.background=$('color').value}function decorate(s){$('deco').textContent+=s+' '}function savePlan(){if(store('plan',{...Object.fromEntries(['title','date','it','notes','color'].map(k=>[k,$(k).value])),deco:$('deco').textContent}))toast('栞を保存しました')}
function journal(){active('nj');v.innerHTML=`<div class="section"><h2>私の旅</h2><p>どんな一日も、あなたの旅。</p><label>今日の記録<textarea id="j" rows="12">${esc(load('journal',''))}</textarea></label><button class="primary" onclick="if(store('journal',$('j').value))toast('日記を保存しました')">保存する</button><p><small>記録はこのブラウザ内だけに保存されます。データ削除で失われることがあります。</small></p></div>`}home();</script></body></html>
